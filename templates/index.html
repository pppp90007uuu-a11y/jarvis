<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tech News Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading {
            display: none;
        }
        .loading.active {
            display: flex;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-bold text-blue-500 mb-2">AI Tech News Agent</h1>
            <p class="text-gray-400">Automated YouTube Video Generator</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Left Side: Trends -->
            <div class="bg-gray-800 p-6 rounded-xl shadow-lg">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-semibold">Trending Topics</h2>
                    <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-sm px-4 py-2 rounded-lg transition">Refresh</button>
                </div>
                <ul id="trends-list" class="space-y-4">
                    <!-- Trends will be loaded here -->
                    <div class="animate-pulse flex space-x-4">
                        <div class="flex-1 space-y-4 py-1">
                            <div class="h-4 bg-gray-700 rounded w-3/4"></div>
                            <div class="h-4 bg-gray-700 rounded"></div>
                        </div>
                    </div>
                </ul>
            </div>

            <!-- Right Side: Preview -->
            <div class="bg-gray-800 p-6 rounded-xl shadow-lg">
                <h2 class="text-2xl font-semibold mb-6">Video Preview</h2>
                <div id="video-container" class="aspect-video bg-black rounded-lg overflow-hidden flex items-center justify-center relative">
                    <p id="placeholder-text" class="text-gray-500">Select a topic to generate video</p>
                    <video id="output-video" class="hidden w-full h-full" controls></video>

                    <!-- Loading Spinner -->
                    <div id="loader" class="loading absolute inset-0 bg-black bg-opacity-70 flex-col items-center justify-center z-10">
                        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mb-4"></div>
                        <p class="text-blue-400 font-medium">Generating Video... This may take a minute.</p>
                    </div>
                </div>
                <div id="script-box" class="mt-6 p-4 bg-gray-700 rounded-lg hidden">
                    <h3 class="text-sm font-bold text-gray-400 uppercase mb-2">Generated Script:</h3>
                    <p id="script-text" class="text-gray-200 text-sm leading-relaxed"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const trendsList = document.getElementById('trends-list');
        const refreshBtn = document.getElementById('refresh-btn');
        const loader = document.getElementById('loader');
        const outputVideo = document.getElementById('output-video');
        const placeholderText = document.getElementById('placeholder-text');
        const scriptBox = document.getElementById('script-box');
        const scriptText = document.getElementById('script-text');

        async function fetchTrends() {
            trendsList.innerHTML = '<p class="text-gray-500">Fetching latest trends...</p>';
            try {
                const response = await fetch('/api/trends');
                const data = await response.json();
                displayTrends(data);
            } catch (error) {
                trendsList.innerHTML = '<p class="text-red-500">Failed to load trends.</p>';
            }
        }

        function displayTrends(trends) {
            trendsList.innerHTML = '';
            trends.forEach(topic => {
                const li = document.createElement('li');
                li.className = 'p-4 bg-gray-700 rounded-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:bg-gray-700 transition border border-transparent hover:border-gray-500';
                li.innerHTML = `
                    <span class="text-gray-200 font-medium flex-1">${topic}</span>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button onclick="generateVideo('${topic}', 'hi')" class="bg-green-600 hover:bg-green-700 text-xs px-3 py-2 rounded font-bold transition flex-1">Hindi</button>
                        <button onclick="generateVideo('${topic}', 'en')" class="bg-indigo-600 hover:bg-indigo-700 text-xs px-3 py-2 rounded font-bold transition flex-1">English</button>
                    </div>
                `;
                trendsList.appendChild(li);
            });
        }

        async function generateVideo(headline, lang) {
            loader.classList.add('active');
            outputVideo.classList.add('hidden');
            placeholderText.classList.add('hidden');
            scriptBox.classList.add('hidden');

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ headline, lang })
                });
                const data = await response.json();

                if (data.success) {
                    outputVideo.src = data.video_url;
                    outputVideo.classList.remove('hidden');
                    scriptText.innerText = data.script;
                    scriptBox.classList.remove('hidden');
                    outputVideo.play();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('An error occurred while generating the video.');
            } finally {
                loader.classList.remove('active');
            }
        }

        refreshBtn.addEventListener('click', fetchTrends);
        fetchTrends();
    </script>
</body>
</html>
